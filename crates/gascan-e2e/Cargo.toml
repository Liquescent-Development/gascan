[package]
name = "gascan-e2e"
version = "0.1.20"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "gascan-e2e-cli"
path = "../gascan/src/main.rs"

[[bin]]
name = "gascan-e2e-daemon"
path = "../gascand/src/main.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
console.workspace = true
gascan-core = { path = "../gascan-core" }
gascan-apple = { path = "../gascan-apple" }
# The e2e daemon binary is built from ../gascand/src/main.rs, so it needs every
# crate that file names -- including the Arca backend arm.
gascan-arca = { path = "../gascan-arca" }
gascan-proto = { path = "../gascan-proto" }
gascan = { path = "../gascan" }
gascan-inherited-fd.workspace = true
gascand = { path = "../gascand" }
hyper-util.workspace = true
indicatif.workspace = true
prost-types.workspace = true
plist.workspace = true
rustix = { workspace = true, features = ["pipe", "termios"] }
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true

[dev-dependencies]
camino.workspace = true
gascan-oci-fixture.workspace = true
command-fds.workspace = true
serde.workspace = true
tempfile = "3"
rustix-openpty = "0.2"

[lints.rust]
unsafe_code = "deny"
