name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      contracts: ${{ steps.detect.outputs.contracts }}
      engine: ${{ steps.detect.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci-detect-changes.sh

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version
          sw_vers

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Guard the ignored-test set
        run: ./scripts/ci-check-ignored-tests.sh

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Full history: release-script-contract.sh resolves HEAD~1, and a default
      # shallow checkout fails it with "Failed to resolve 'HEAD~1' as a valid ref".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release and CI contracts
        run: ./scripts/ci-run-release-contracts.sh

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: macos-26
    # 90 and not the 45 this job carried when it compiled two library targets
    # (--target ContainerBridge --target SandboxEngineProto). It now release-builds
    # the arca-engine executable product -- which links the vendored containerization
    # graph and reaches dependency validation library builds skip -- plus every test
    # target in the package, because --filter selects what RUNS and not what BUILDS.
    # The live-tier step below adds a cold cargo build of gascan-arca and its
    # dependency graph on top. 45 (the original Swift budget) + 15 (product and test
    # targets where two libraries stood) + 30 (matching the `rust` job's own budget
    # for the cargo work now added). Not measured on a cold runner; this is headroom
    # rather than a bound, and GitHub's default is 360.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          swift --version
          sw_vers

      # The checkout path is captured rather than discarded because
      # engine-targets-check.sh needs an Arca tree, and this job is the only one
      # that has one. `head -1` and not `tail`: the script prints checkout then
      # binary, in its closing `printf '%s\n%s\n' "$checkout" "$binary"`
      # (scripts/build-arca-engine.sh:302 -- re-derive with `grep -n "printf '%s"`
      # rather than trusting the number, it has gone stale twice). The pipeline would
      # otherwise mask a build failure behind head's exit status, so the script's
      # stdout goes to a file first and its own status is what gates the step.
      - name: Build the pinned Arca engine
        run: |
          set -eu
          ./scripts/build-arca-engine.sh >"$RUNNER_TEMP/engine-build.out"
          cat "$RUNNER_TEMP/engine-build.out"
          checkout=$(head -1 "$RUNNER_TEMP/engine-build.out")
          test -d "$checkout" || {
            printf 'build-arca-engine.sh printed no usable checkout path: %s\n' "$checkout" >&2
            exit 1
          }
          printf 'ARCA_CHECKOUT=%s\n' "$checkout" >>"$GITHUB_ENV"

      - name: The engine must not reach DockerAPI
        run: ./tests/release/engine-targets-check.sh "$ARCA_CHECKOUT"

      # The live tier runs nowhere else. Its tests are #[ignore]d because they need a
      # built arca-engine, and this is the only job that has one -- so without this
      # step the milestone's headline deliverable executes only by hand and rots the
      # way Arca's own tests were rotting before the engine build script existed.
      #
      # `tail -1` and not `head`: the script prints checkout then binary, in the same
      # closing printf the step above cites (scripts/build-arca-engine.sh:302), and
      # that step consumes the first line. The binary is guarded before use -- for the
      # same reason the checkout is --
      # an empty or bogus second line would otherwise reach the test harness as a
      # spawn failure rather than as a build failure. `-f` as well as `-x`, because a
      # DIRECTORY satisfies `-x`: a script that printed only its checkout line would
      # otherwise hand the test harness a directory and fail somewhere far from here.
      #
      # `running 4 tests` is the expectation: four #[ignore] attributes exist across
      # crates/gascan-arca/tests/live (2 in connect.rs, 2 in read_rpcs.rs), so
      # `-- --ignored` selects exactly those four. MEASURED at this revision:
      # `cargo test -p gascan-arca --test live` reports `running 6 tests` and
      # `2 passed; 0 failed; 4 ignored`.
      #
      # A smaller number means tests were dropped, and this step cannot see that:
      # `cargo test -- --ignored` exits 0 on `running 0 tests`. What actually
      # closes it is scripts/ci-check-ignored-tests.sh, which diffs the whole
      # ignored set against tests/ci/expected-ignored-tests.txt and fails in
      # either direction -- and any edit under crates/gascan-arca fires `rust` as
      # well as `engine`, so that guard runs whenever this step's input changes.
      # The number above is a reader's orientation, not a gate; the gate is the
      # baseline file.
      - name: The live tier, against the engine just built
        run: |
          set -eu
          binary=$(tail -1 "$RUNNER_TEMP/engine-build.out")
          { test -f "$binary" && test -x "$binary"; } || {
            printf 'build-arca-engine.sh printed no usable engine binary: %s\n' "$binary" >&2
            exit 1
          }
          GASCAN_ARCA_ENGINE_BIN=$binary \
            cargo test -p gascan-arca --test live --no-fail-fast -- --ignored

  # The required check. Every sentence of the comment that used to stand here was
  # false of this job: it described the temporary `runtime-probe` job, deleted in
  # 37e3ec0, as "deliberately outside gate's needs, so it can never block a
  # merge". This job is permanent, is the required check, and exists to block
  # merges -- and it is the block a reader reaches for when asking what gates the
  # engine job.
  gate:
    needs: [changes, rust, contracts, engine]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          ENGINE: ${{ needs.engine.result }}
        run: |
          set -eu
          printf 'changes=%s rust=%s contracts=%s engine=%s\n' \
            "$CHANGES" "$RUST" "$CONTRACTS" "$ENGINE"
          test "$CHANGES" = success || {
            printf 'gate: changes must succeed, was %s\n' "$CHANGES" >&2
            exit 1
          }
          status=0
          for result in "$RUST" "$CONTRACTS" "$ENGINE"; do
            case "$result" in
              success|skipped) ;;
              *) printf 'gate: a job reported %s\n' "$result" >&2; status=1 ;;
            esac
          done
          exit "$status"
